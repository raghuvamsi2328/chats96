<div class="app-container">
  <!-- Header Bar -->
  <header class="app-header">
    <div class="header-content">
      <div class="app-title">
        <img src="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke='currentColor'%3e%3cpath stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z'/%3e%3c/svg%3e" 
             alt="Chat icon" 
             class="chat-icon-img" 
             width="24" 
             height="24" />
        <h1>chats96</h1>
      </div>
      <button (click)="toggleTheme()" class="theme-toggle" [attr.aria-label]="'Switch to ' + (theme() === 'light-theme' ? 'dark' : 'light') + ' theme'">
        <img *ngIf="theme() === 'light-theme'" 
             src="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke='currentColor'%3e%3cpath stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z'/%3e%3c/svg%3e" 
             alt="Dark mode" 
             class="theme-icon-img" 
             width="16" 
             height="16" />
        <img *ngIf="theme() === 'dark-theme'" 
             src="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke='currentColor'%3e%3cpath stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z'/%3e%3c/svg%3e" 
             alt="Light mode" 
             class="theme-icon-img" 
             width="16" 
             height="16" />
        <span class="theme-text">{{ theme() === 'light-theme' ? 'Dark' : 'Light' }}</span>
      </button>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="main-content">
    <!-- Welcome/Setup Screen -->
    <div *ngIf="!isChatActive" class="welcome-screen">
      <div class="welcome-card">
        <div class="welcome-header">
          <h2>Welcome to chats96</h2>
          <p>Connect instantly with friends and colleagues</p>
        </div>

        <div class="setup-form">
          <!-- Name Input -->
          <div class="input-section">
            <label for="chatNameInput" class="input-label">
              <img src="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke='currentColor'%3e%3cpath stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z'/%3e%3c/svg%3e" 
                   alt="User" 
                   class="input-icon" 
                   width="16" 
                   height="16" />
              Display Name
            </label>
            <input 
              id="chatNameInput" 
              type="text" 
              [(ngModel)]="chatName" 
              placeholder="Enter your name"
              class="form-input"
              required 
            />
          </div>

          <!-- Action Buttons -->
          <div class="action-section">
            <button 
              (click)="createNewChat()" 
              [disabled]="!chatName.trim()"
              class="primary-button create-button">
              <img src="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke='currentColor'%3e%3cpath stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M12 6v6m0 0v6m0-6h6m-6 0H6'/%3e%3c/svg%3e" 
                   alt="Create" 
                   class="button-icon" 
                   width="18" 
                   height="18" />
              Create New Room
            </button>

            <div class="divider">
              <span>or</span>
            </div>

            <!-- Join Existing Chat -->
            <div class="join-section">
              <label for="joinKeyInput" class="input-label">
                <img src="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke='currentColor'%3e%3cpath stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1'/%3e%3c/svg%3e" 
                     alt="Link" 
                     class="input-icon" 
                     width="16" 
                     height="16" />
                Room Key
              </label>
              <div class="join-input-group">
                <input 
                  id="joinKeyInput" 
                  type="text" 
                  [ngModel]="chatRoomKey" 
                  (ngModelChange)="setChatRoomKeyManually($event)" 
                  placeholder="Paste room key here"
                  class="form-input"
                />
                <button 
                  (click)="joinExistingChat()" 
                  [disabled]="!chatRoomKey || !chatName.trim()"
                  class="secondary-button join-button">
                  Join
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Chat Interface -->
    <div *ngIf="isChatActive" class="chat-interface">
      <!-- Chat Header -->
      <div class="chat-top-bar">
        <div class="room-info">
          <div class="room-details">
            <h3 class="room-name">{{ chatRoomKey }}</h3>
            <span class="user-name">{{ chatName }}</span>
          </div>
        </div>
        <div class="chat-actions">
          <button (click)="shareChatRoom()" class="share-button">
            <img src="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke='currentColor'%3e%3cpath stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z'/%3e%3c/svg%3e" 
                 alt="Share" 
                 class="share-icon-img" 
                 width="16" 
                 height="16" />
            <span class="share-text">Share</span>
          </button>
        </div>
      </div>

      <!-- Chat Window -->
      <div class="chat-window-container">
        <app-chat-window
          [chatRoomKey]="chatRoomKey!"
          [chatName]="chatName">
        </app-chat-window>
      </div>
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="error-toast">
      <img src="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke='currentColor'%3e%3cpath stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.34 16.5C2.57 17.333 3.532 19 5.072 19z'/%3e%3c/svg%3e" 
           alt="Error" 
           class="error-icon-img" 
           width="16" 
           height="16" />
      <span>{{ errorMessage }}</span>
    </div>
  </main>
</div>
