<div class="chat-window">
  <!-- Active Users Info -->
  <div class="chat-status-bar">
    <div class="active-users">
      <img src="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke='currentColor'%3e%3cpath stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M5.636 18.364a9 9 0 010-12.728m12.728 0a9 9 0 010 12.728m-9.9-2.829a5 5 0 010-7.07m7.072 0a5 5 0 010 7.07M13 12a1 1 0 11-2 0 1 1 0 012 0z'/%3e%3c/svg%3e" 
           alt="Online" 
           class="status-indicator-img" 
           width="12" 
           height="12" />
      <span class="status-text">{{ activeUsersInRoom }} {{ activeUsersInRoom === 1 ? 'user' : 'users' }} online</span>
    </div>
  </div>

  <!-- Messages Display Area -->
  <div class="messages-container" role="log" aria-live="polite" aria-label="Chat messages">
    <div #messagesDisplay class="messages-list" tabindex="0">
      <div *ngFor="let msg of messages" class="message-wrapper">
        <div class="message-bubble" [class.own-message]="msg.sender === chatName" role="article">
          <div class="message-header">
            <span class="sender-name">{{ msg.sender }}</span>
            <span class="message-time">{{ msg.timestamp | date:'shortTime' }}</span>
          </div>
          <div class="message-content">{{ msg.messageContent }}</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Message Input Area -->
  <div class="message-input-container">
    <form (ngSubmit)="sendMessage()" class="input-wrapper">
      <input
        type="text"
        [(ngModel)]="newMessage"
        name="message"
        placeholder="Type a message..."
        class="message-input"
        [disabled]="hubConnection.state !== 'Connected'"
        autocomplete="off"
        maxlength="1000"
        aria-label="Type your message"
      />
      <button 
        type="submit"
        [disabled]="!newMessage.trim() || hubConnection.state !== 'Connected'"
        class="send-button"
        aria-label="Send message">
        <img src="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke='currentColor'%3e%3cpath stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M12 19l9 2-9-18-9 18 9-2zm0 0v-8'/%3e%3c/svg%3e" 
             alt="Send" 
             class="send-icon-img" 
             width="16" 
             height="16" />
      </button>
    </form>
    <div class="connection-status" [class.connected]="hubConnection.state === 'Connected'">
      {{ hubConnection.state === 'Connected' ? 'Connected' : 'Connecting...' }}
    </div>
  </div>
</div>
