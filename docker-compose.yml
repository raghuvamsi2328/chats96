# docker-compose.yml (for your chats96 application)
version: '3.8'

services:
  backend:
    build:
      context: ./chats96.Api # Path to your .NET API folder
      dockerfile: Dockerfile
    ports:
      # Map an unused HOST port (e.g., 5001) to the container's internal port 80
      - "5001:80" # This port will be used by NPM to talk to your backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production # Or 'Development' if you want Swagger publicly accessible
      ConnectionStrings__DefaultConnection: "Host=database;Port=5432;Username=chatuser;Password=chatpassword;Database=chatdb"
    depends_on:
      - database
    networks:
      - chat-network # Keep this for internal app communication (backend <-> db)
    restart: unless-stopped

  frontend:
    build:
      context: ./chats96App # Path to your Angular app folder
      dockerfile: Dockerfile
    ports:
      # Map another unused HOST port (e.g., 4201) to the container's internal port 80
      - "4201:80" # This port will be used by NPM to talk to your frontend
    depends_on:
      - backend
    networks:
      - chat-network # Keep this for internal app communication (frontend -> backend API calls)
    restart: unless-stopped

  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: chatdb
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: chatpassword
    volumes:
      - chat_db_data:/var/lib/postgresql/data # Persistent storage for database data
    # You generally don't need to expose DB to host here, unless for direct debugging
    # If you remove it, '5432' on your host is free.
    # If you add it for debugging, pick an unused host port, e.g., - "5433:5432"
    networks:
      - chat-network
    restart: unless-stopped

volumes: # Define the named volume for database persistence
  chat_db_data:

networks:
  chat-network:
    driver: bridge
  # REMOVE THE NPM NETWORK DECLARATION HERE:
  # YOUR_NPM_NETWORK_NAME:
  #   external: true