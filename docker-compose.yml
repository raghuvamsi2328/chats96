# This file should be in the root of your project,
# alongside the 'chats96.Api' and 'chats96App' folders.
version: '3.8'

services:
  backend:
    build:
      context: ./chats96.Api # Path to your .NET API folder
      dockerfile: Dockerfile
    ports:
      - "5000:80" # Changed from 3000 to 5000 (common for .NET Kestrel)
                  # Access from outside: http://your-server-ip:5000
    environment:
      ASPNETCORE_ENVIRONMENT: Production # <-- Set this based on your testing needs
      ConnectionStrings__DefaultConnection: "Host=database;Port=5432;Username=chatuser;Password=chatpassword;Database=chatdb"
    depends_on:
      - database
    networks:
      - chat-network
    restart: unless-stopped

  frontend:
    build:
      context: ./chats96App # Path to your Angular app folder
      dockerfile: Dockerfile
    ports:
      - "4200:80" # Changed from 8080 to 4200 (common for Angular dev server, good for test)
                  # Access from outside: http://your-server-ip:4200
    depends_on:
      - backend
    networks:
      - chat-network
    restart: unless-stopped

  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: chatdb
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: chatpassword
    volumes:
      - chat_db_data:/var/lib/postgresql/data
    ports:
      # Optional: Only expose if you need to connect from host for debugging (e.g., DBeaver)
      # If you don't need direct host access, you can remove this line to keep 5432 free on host.
      - "5433:5432" # Changed from 5432 to 5433
    networks:
      - chat-network
    restart: unless-stopped

volumes:
  chat_db_data:

networks:
  chat-network:
    driver: bridge